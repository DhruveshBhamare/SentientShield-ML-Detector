version: "3.8"

services:
  api:
    build: .
    container_name: sentientshield-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      JWT_SECRET: "change-me-in-prod"
      JWT_ALG: "HS256"
      JWT_ISSUER: "sentientshield"
      JWT_AUDIENCE: "sentientshield-users"
      TRUSTED_ORIGINS: "http://localhost,http://127.0.0.1,http://streamlit:8501"
      RETRAIN_INTERVAL_SECONDS: "86400"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./artifacts:/app/artifacts
      - ./neuralfort_activations.json:/app/neuralfort_activations.json
      - ./frontend/static:/app/frontend/static
      - ./logs:/app/logs

  streamlit:
    build: .
    container_name: sentientshield-dashboard
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_URL: "http://api:8000"
      DEV_TOKEN: "dev-token-secret"
    command: ["streamlit", "run", "streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
      - ./frontend/static:/app/frontend/static
