version: '3.8'

services:
  sentientshield-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "10000:10000"
    env_file:
      - ../.env
    restart: always
    healthcheck:
      test: ["CMD", "python", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ./artifacts:/app/artifacts
      - ./logs:/app/logs

  sentientshield-analytics:
    build:
      context: ..
      dockerfile: Dockerfile
    command: streamlit run src/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    restart: always
    depends_on:
      - sentientshield-api
