services:
  # SentientShield Backend (FastAPI)
  - type: web
    name: sentientshield-api
    env: python
    buildCommand: pip install -r requirements.txt && export PYTHONPATH=$PYTHONPATH:. && python -m scripts.setup_production
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-10000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: JWT_SECRET
        generateValue: true
      - key: HF_HUB_MODEL_ID
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: TRUSTED_ORIGINS
        value: "*" # Change to your final frontend domain in production
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: "qwen/qwen3.5-397b-a17b"

  # SentientShield Analytics Dashboard (Streamlit)
  - type: web
    name: sentientshield-analytics
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/streamlit_app.py --server.port ${PORT:-8501} --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_URL
        fromService:
          name: sentientshield-api
          type: web
          property: host

  # SentientShield Workflows (Background Processing)
  - type: worker
    name: sentientshield-workflows
    env: python
    buildCommand: pip install -r requirements.txt && export PYTHONPATH=$PYTHONPATH:. && python -m scripts.setup_production
    startCommand: python scripts/render_workflows.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NVIDIA_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: RENDER
        value: "true"
