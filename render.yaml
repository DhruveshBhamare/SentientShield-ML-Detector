services:
  # SentientShield Backend (FastAPI)
  - type: web
    name: sentientshield-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: JWT_SECRET
        generateValue: true
      - key: HF_HUB_MODEL_ID
        sync: false
      - key: TRUSTED_ORIGINS
        value: "*" # Change to your final frontend domain in production
      - key: NVIDIA_API_KEY
        sync: false

  # SentientShield Analytics Dashboard (Streamlit)
  - type: web
    name: sentientshield-analytics
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run src/streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    envVars:
      - key: PORT
        value: 8501
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: API_BASE_URL
        fromService:
          name: sentientshield-api
          type: web
          property: host
