name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: Set Permissions for Scripts
        run: chmod +x scripts/*.py scripts/*.bat 2>/dev/null || true

      - name: Run Tests
        run: |
          # Skip tests requiring large models if not available
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest src/tests/

  deploy:
    name: Production Deployment
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for Healthcheck
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build and Start Container
        run: |
          # Use 'docker compose' instead of 'docker-compose' to avoid Exit 127
          docker compose -f docker/docker-compose.yml build
          docker compose -f docker/docker-compose.yml up -d

      - name: Wait for Service
        run: sleep 15

      - name: Run Healthcheck
        run: |
          pip install requests
          python3 scripts/healthcheck.py
        env:
          PORT: 10000

      - name: Deploy to Production (Render)
        if: success()
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
