name: Deploy SentientShield

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout repository
      - name: Step 1: Checkout repository
        uses: actions/checkout@v3

      # Step 2 – Setup Python
      - name: Step 2: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3 – Install dependencies
      - name: Step 3: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # Step 4 – Run tests
      - name: Step 4: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # Tests will automatically skip model-heavy checks if models are missing
          pytest src/tests/ -v

      # Step 5 – Build Docker container
      - name: Step 5: Build Docker container
        run: |
          docker compose -f docker/docker-compose.yml build

      # Step 6 – Deploy
      - name: Step 6: Deploy to Production (Render)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          # Start container locally for a final smoke test/healthcheck
          docker compose -f docker/docker-compose.yml up -d
          sleep 15
          python scripts/healthcheck.py
          # Final trigger to production hosting
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        env:
          PORT: 10000
