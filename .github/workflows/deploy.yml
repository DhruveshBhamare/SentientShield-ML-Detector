name: Deploy SentientShield

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 – Checkout repository
      - name: Step 1: Checkout repository
        uses: actions/checkout@v3

      # Step 2 – Setup Python
      - name: Step 2: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      # Step 3 – Install dependencies
      - name: Step 3: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4 – Ensure pytest is installed
      - name: Step 4: Ensure pytest is installed
        run: |
          pip install pytest pytest-asyncio httpx

      # Step 5 – Run tests
      - name: Step 5: Run tests
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          # Skip model-heavy tests automatically via pytest-skipif in test files
          pytest src/tests/ -v

      # Step 6 – Build Docker container and Deploy
      - name: Step 6: Build Docker container
        run: |
          docker compose -f docker/docker-compose.yml build

      - name: Final Production Deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          # Verify container stability before triggering production
          docker compose -f docker/docker-compose.yml up -d
          sleep 15
          python scripts/healthcheck.py
          # Deploy to Render
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
        env:
          PORT: 10000
